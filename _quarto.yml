project:
  type: website
  render:
    - index.qmd
    - presentation.qmd

website:
  title: "Beating the Odds"
  navbar:
    left:
      - text: "Report"
        href: index.qmd
      - text: "Presentation"
        href: presentation.qmd

format:
  html:
    toc: true                   # table of contents menu
    toc-depth: 2
    number-sections: false      # our headings are numbered by hand
    code-fold: true
    code-tools: true
    theme: cosmo
  revealjs:
    slide-number: true
    smaller: true
